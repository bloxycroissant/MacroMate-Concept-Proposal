spring.datasource.url=${MACROMATE_DB_URL:jdbc:h2:file:./data/macromate;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${MACROMATE_DB_USERNAME:sa}
spring.datasource.password=${MACROMATE_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=${MACROMATE_H2_CONSOLE_ENABLED:false}
server.address=127.0.0.1
